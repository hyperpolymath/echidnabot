# cargo-audit.yml — Dependency vulnerability scanning for Rust projects.
# Runs cargo-audit against the RustSec advisory database.
name: Cargo Audit
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 06:00 UTC to catch new advisories.
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        # `toolchain:` is mandatory when this action is pinned to a SHA — see
        # the note in stress-test.yml. This SHA currently tolerates its absence;
        # stating it explicitly keeps the step working across future re-pins.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
      - name: Write summary
        if: always()
        run: |
          echo "## Cargo Audit Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cargo audit 2>&1 | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
