# cargo-audit.yml — Dependency vulnerability scanning for Rust projects.
# Runs cargo-audit against the RustSec advisory database.
name: Cargo Audit
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 06:00 UTC to catch new advisories.
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # This pin currently carries a `toolchain: default: stable`, so it works
      # today. State it anyway: a Dependabot SHA bump can land on a commit with
      # NO default, at which point the job dies with `invalid toolchain name `
      # and nothing in the diff explains why. See stress-test.yml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
      - name: Write summary
        if: always()
        run: |
          echo "## Cargo Audit Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cargo audit 2>&1 | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
