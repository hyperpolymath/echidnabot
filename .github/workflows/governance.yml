# This workflow is managed by gh actions-lock.
# Caller of the estate governance bundle in metadatastician/standards, at the
# version that gitbot-fleet calls. gitbot-fleet has a pinned copy of this
# crate (bots/echidnabot/), so a line that fails a governance gate there
# (for example UUID conformance) must fail here first.
#
# The earlier caller named hyperpolymath/standards at 740c9d7. It did not
# start: each run ended at creation, with no job and no check.
name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  governance:
    uses: metadatastician/standards/.github/workflows/governance-reusable.yml@ea2f4d8a886585ed442687ae63d4ad7493379ba4
    permissions:
      actions: read
      contents: read
      security-events: write
