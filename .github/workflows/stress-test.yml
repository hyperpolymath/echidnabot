# SPDX-License-Identifier: MPL-2.0
name: Stress Testing
on:
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 3am UTC
  workflow_dispatch:
permissions: read-all
jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # dtolnay/rust-toolchain selects its toolchain from the REF it is
      # referenced by (@stable, @1.91) -- each of those branches ships an
      # action.yml carrying a matching `default:`. SHA-pinning removes that
      # signal. MEASURED: this commit's action.yml has `toolchain: required:
      # true` and NO default, so the job died with
      #   error: invalid toolchain name ''
      # The `# stable 1.91` comment beside the pin was therefore decoration,
      # not fact. Passing `toolchain:` explicitly makes the pin genuinely inert.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable 1.91
        with:
          toolchain: stable

      - name: Install stress testing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y stress-ng valgrind
      - name: Build release
        run: cargo build --release --all-features
      - name: Concurrent operations stress test
        run: |
          # Run binary with high concurrency
          for i in {1..100}; do
            timeout 1s ./target/release/* &
          done
          wait
      - name: Memory pressure test
        run: |
          # Run under memory constraints
          ulimit -v 512000  # 500MB virtual memory limit
          cargo test --release
      - name: Long-running scenario test
        run: |
          # Test for memory leaks over time
          timeout 300s valgrind --leak-check=full --error-exitcode=1 \
            ./target/release/* || true
      - name: Stress test with stress-ng
        run: |
          # CPU and I/O stress
          stress-ng --cpu 4 --io 2 --timeout 60s &
          STRESS_PID=$!
          cargo test --release
          kill $STRESS_PID || true
