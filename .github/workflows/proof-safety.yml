name: Proof Safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: proof-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    name: Proof protocol contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Test REST and GraphQL wire contracts
        run: |
          cargo test --locked --test protocol_contract
          cargo test --locked --bin echidnabot clone_contract_tests
          cargo test --locked --lib git_process_tests

  theory:
    # Receipt-boundary theory (docs/PROOF-STATUS.adoc T-RECEIPT): the Agda
    # source and its Lean and Rocq re-proofs, each checked by its own kernel
    # at this commit. Toolchains come from pinned upstream release archives,
    # not the Guix manifest: this is the recorded PROOF-POLICY §6 deviation
    # D-THEORY-TOOLS in docs/PROOF-STATUS.adoc. Each archive is verified by
    # digest, and each script fails if the version it observes differs.
    name: Theory proofs (Agda, Lean, Rocq)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AGDA_URL: https://github.com/agda/agda/releases/download/v2.8.0.2/Agda-v2.8.0.2-linux.tar.xz
      AGDA_SHA256: 2bcf24bb561b1be859bba841e5d67962d1616b3251bc147f878e4f60a2fbd9f7
      LEAN_URL: https://releases.lean-lang.org/lean4/v4.35.0/lean-4.35.0-linux.tar.zst
      LEAN_SHA256: 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Agda 2.8.0.2 (digest-verified release)
        run: |
          mkdir -p "$RUNNER_TEMP/agda"
          curl --proto "=https" --tlsv1.2 -fsSL -o "$RUNNER_TEMP/agda.tar.xz" "$AGDA_URL"
          echo "$AGDA_SHA256  $RUNNER_TEMP/agda.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/agda.tar.xz" -C "$RUNNER_TEMP/agda"
          echo "$RUNNER_TEMP/agda" >> "$GITHUB_PATH"
      - name: Install Lean 4.35.0 (digest-verified release)
        run: |
          mkdir -p "$RUNNER_TEMP/lean"
          curl --proto "=https" --tlsv1.2 -fsSL -o "$RUNNER_TEMP/lean.tar.zst" "$LEAN_URL"
          echo "$LEAN_SHA256  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Install Coq 8.18.0 (Ubuntu 24.04 archive)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q coq
      - name: Agda source (strict profile)
        run: ./scripts/check-agda-proofs.sh
      - name: Lean and Rocq recheck legs (with negative controls)
        run: ./scripts/check-theory-rechecks.sh
