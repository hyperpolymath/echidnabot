# This workflow is managed by gh actions-lock.
# Caller of the estate secret scanner in hyperpolymath/proven-cicd-and-workflows
# (proven-cicd is retired; its commits are merged there). The pin is a
# descendant of the commit that gitbot-fleet calls (03e858b), and the
# reusable differs from it only in the caller check, which admits the new
# name. gitbot-fleet has a pinned copy of this crate (bots/echidnabot/), so a
# line that fails the scan there must fail here first.
#
# The earlier caller named hyperpolymath/standards at 740c9d7. It did not
# start: each run ended at creation, with no job and no check.
#
# Boundaries, as in the gitbot-fleet caller:
#   * `fast-pr` is false: each run scans the full history.
#   * No `secrets:` line. The callee declares no workflow_call secret.
#   * `contents: read` is the whole grant.
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
# Estate guardrail: cancel superseded runs so re-pushes / rebased PR
# updates do not pile up queued runs against the shared account-wide
# Actions concurrency pool. Safe — read-only scan, no mutation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    permissions:
      contents: read
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/secret-scanner-reusable.yml@1fd5e6371a50f0fc3687206a5adca0cdf7b39aa6
    with:
      fast-pr: false
