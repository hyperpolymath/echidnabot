# Mise configuration for echidnabot
# Project-specific tool versions for reproducible development.
# Run `mise install` to install all tools.

[tools]
# Primary language runtime
rust = "1.97.0"

# Task runner (wraps justfile)
just = "1.56.0"

# Node.js for build tooling (optional, for some scripts)
node = "26.5.0"

# Python for some scripts (optional)
python = "3.14.6"

[env]
# Common environment variables
NODE_ENV = "development"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
RUST_BACKTRACE = "full"

# Task aliases
[tool_alias]
# Build the project
build = "cargo build --release"
build-dev = "cargo build"

# Run tests
test = "cargo test"
test-all = "cargo test --all"

# Check the project
check = "cargo check"
check-all = "cargo check --all"

# Run clippy linting
lint = "cargo clippy --all-targets --all-features -- -D warnings"

# Format code
fmt = "cargo fmt --all"

# Run the bot
run = "cargo run --release"

# Documentation
docs = "cargo doc --no-deps --open"
